{% extends 'base.html' %}
{% from '_ui.html' import icon %}
{% block title %}{{'Edit' if entry else 'Add'}} credential · KazeVault{% endblock %}
{% block content %}
<header>
  <div>
    <div class="eyebrow">Encrypted credential</div>
    <h1>{{'Edit' if entry else 'Add'}} credential</h1>
  </div>
  <a class="button ghost" href="/passwords">Cancel</a>
</header>
<div class="card form-card">
  <form method="post" action="/passwords/save">
    <input type="hidden" name="csrf_token" value="{{csrf_token}}">
    <input type="hidden" name="id" value="{{entry.id if entry else 0}}">
    <label>Service or website name<input name="service" value="{{entry.service if entry else ''}}" required autofocus></label>
    <label>Website URL<input name="website" type="url" placeholder="https://" value="{{entry.website if entry else ''}}"></label>
    <label>Username or email<input name="username" autocomplete="off" value="{{entry.username if entry else ''}}"></label>
    <label>Password
      <div class="inline">
        <input id="pw" name="password" type="password" autocomplete="new-password" value="{{entry.secret_password if entry else ''}}" required>
        <button type="button" onclick="document.getElementById('pw').type=document.getElementById('pw').type==='password'?'text':'password'">{{ icon('eye','sm') }}Show</button>
        <button type="button" onclick="generate()">{{ icon('refresh','sm') }}Generate</button>
      </div>
    </label>
    <label>Private notes<textarea name="notes" rows="5">{{entry.secret_notes if entry else ''}}</textarea></label>
    <div class="two">
      <label>Category<input name="category" value="{{entry.category if entry else ''}}"></label>
      <label>Tags<input name="tags" value="{{entry.tags if entry else ''}}"></label>
    </div>
    <label class="check"><input type="checkbox" name="favorite" {% if entry and entry.favorite %}checked{% endif %}> Favorite</label>
    <button class="primary">Save encrypted credential</button>
  </form>
</div>
<script>async function generate(){const r=await fetch('/passwords/generate?length=20');const d=await r.json();document.getElementById('pw').value=d.password}</script>
{% endblock %}
