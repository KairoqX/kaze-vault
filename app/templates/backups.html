{% extends 'base.html' %}{% block content %}<header><div><div class="eyebrow">DATA SAFETY</div><h1>Backups</h1><p class="muted">Database and attachments are archived together.</p></div><form method="post" action="/backup"><button class="primary">Create backup</button></form></header><section class="card">{% for i in items %}<div class="row"><span class="kind">ZIP</span><span class="title">{{i.name}}</span><span class="muted">{{(i.stat().st_size/1024)|round(1)}} KB</span></div>{% else %}<div class="empty">No backups created yet.</div>{% endfor %}</section>{% endblock %}
