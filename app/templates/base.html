<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KazeVault</title><link rel="stylesheet" href="/static/style.css"><style>html,body{overflow-x:hidden}button,.button,a,input,select,textarea{min-height:44px}.actions,.inline,.file-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filters select{max-width:150px;background:#0f1011;color:var(--text);border:1px solid var(--line);padding:10px}.file-grid,.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.file-card,.media-card{display:flex;flex-direction:column;gap:10px;min-width:0}.file-card strong,.media-card strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-icon{font-size:34px;color:var(--accent)}.file-actions{margin-top:auto}.file-actions form{display:inline}.secret{font-family:monospace;color:var(--accent);word-break:break-all}.media-card img,.media-card video{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;background:#0b0c0d}.media-card audio{width:100%}.focus{outline:2px solid var(--accent);outline-offset:2px}@media(max-width:760px){main{padding:22px 14px;padding-bottom:calc(28px + env(safe-area-inset-bottom))}.shell{min-width:320px}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:24px}.card{padding:16px}.upload form{display:block}.upload button{width:100%;margin-top:8px}.filters{display:grid;grid-template-columns:1fr auto}.filters button{grid-column:span 2}.file-grid,.media-grid{grid-template-columns:1fr}.row{flex-wrap:wrap}.row .title{min-width:calc(100% - 90px)}header{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions>*{flex:1}.inline input{min-width:0;flex:1}.inline button{padding:8px}}</style></head><body><div class="shell"><aside><a class="brand" href="/">Kaze<span>Vault</span></a><nav><a href="/">◈ Dashboard</a><a href="/records">▦ All Records</a><a href="/records/new?kind=note">✎ Notes</a><a href="/records/new?kind=journal">◷ Journal</a><a href="/documents">▣ Files</a><a href="/media">▶ Media</a><a href="/passwords">⚿ Passwords</a><a href="/records?kind=knowledge">⌘ Knowledge Base</a><a href="/search">⌕ Search</a><a href="/backups">↥ Backups</a><a href="/system">◉ System</a></nav>{% if request.session.get('uid') %}<form method="post" action="/logout" class="logout"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><button>Sign out</button></form>{% endif %}</aside><main>{% block content %}{% endblock %}</main></div></body></html>
