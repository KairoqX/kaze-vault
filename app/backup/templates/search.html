{% extends 'base.html' %}{% block content %}<header><div><div class="eyebrow">UNIFIED SEARCH</div><h1>Search</h1><p class="muted">Notes, journal, records, knowledge, and file metadata. Password secrets are excluded.</p></div></header><form class="search filters" action="/search"><input name="q" value="{{q}}" placeholder="Search your vault"><select name="kind"><option value="">All content</option><option value="note" {% if kind=='note' %}selected{% endif %}>Notes</option><option value="journal" {% if kind=='journal' %}selected{% endif %}>Journal</option><option value="knowledge" {% if kind=='knowledge' %}selected{% endif %}>Knowledge</option><option value="record" {% if kind=='record' %}selected{% endif %}>Records</option><option value="file" {% if kind=='file' %}selected{% endif %}>Files</option></select><input name="category" value="{{category}}" placeholder="Category"><label class="check"><input type="checkbox" name="favorite" value="true" {% if favorite %}checked{% endif %}> Favorites</label><button>Search</button></form><section class="card">{% for r in results %}<a class="row" href="{{r.url}}"><span class="kind">{{r.type}}</span><span class="title">{{r.title}}</span><span class="muted">{{r.meta}}</span><time>{{r.date.strftime('%d %b %Y')}}</time></a>{% else %}<div class="empty">No matching results.</div>{% endfor %}</section>{% endblock %}
